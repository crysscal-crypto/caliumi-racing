name: Prova IA
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          K: ${{ secrets.GROQ_API_KEY }}
        run: |
          [ -z "$K" ] && echo "RISULTATO chiave mancante" && exit 0
          B='{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":"Rispondi in JSON con {\"ok\":\"si\"}"}],"response_format":{"type":"json_object"},"max_tokens":30}'
          echo "RISULTATO $(curl -s -X POST https://api.groq.com/openai/v1/chat/completions -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d "$B" | head -c 400)"
