name: Prova IA
on: workflow_dispatch
permissions:
  models: read
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Rispondi in JSON con {\"ok\":\"si\"}"}],"response_format":{"type":"json_object"},"max_tokens":50}'
          echo "A1"; curl -s -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$B" | head -c 800; echo
          echo "A2"; curl -s -X POST https://models.github.ai/orgs/crysscal-crypto/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$B" | head -c 800; echo
          B2='{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Rispondi in JSON con {\"ok\":\"si\"}"}],"response_format":{"type":"json_object"},"max_tokens":50}'
          echo "A3"; curl -s -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$B2" | head -c 800; echo
