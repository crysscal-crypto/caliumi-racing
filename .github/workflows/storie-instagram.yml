# Pubblica su Instagram le storie con i risultati delle sessioni MotoGP e WorldSBK appena concluse.
# Il controllo principale arriva ogni 5 minuti da cron-job.org; questo è solo un controllo di riserva
# (GitHub lo fa partire quando può) e si può lanciare a mano con "Run workflow".
name: Storie Instagram

on:
  schedule:
    - cron: "*/15 * * * 5,6,0"
    - cron: "*/15 0-10 * * 1"
  workflow_dispatch:

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Pubblica storie
        run: |
          RISPOSTA=$(curl -sS --max-time 290 -w ' [HTTP %{http_code}]' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.caliumiracing.com/api/instagram/storie || true)
          echo "$RISPOSTA"
          echo "::notice title=Risposta del sito::$RISPOSTA"
          case "$RISPOSTA" in *"[HTTP 200]") ;; *) exit 1 ;; esac
