# Giro di pubblicazione automatica: storie Instagram (video con musica), Reel, post Facebook,
# IndexNow e articoli dell'IA. Gira qui su GitHub perché serve ffmpeg (su Cloudflare non c'è).
# Lo fa partire il sito ogni 5 minuti (cron-job.org -> /api/instagram/storie?sfondo=1 -> GitHub);
# il controllo programmato qui sotto è solo una riserva. Si può lanciare a mano con "Run workflow".
name: Storie Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * 5,6,0"
    - cron: "*/15 0-10 * * 1"

# un giro alla volta: se ne arriva un altro mentre lavora, aspetta
concurrency:
  group: giro-pubblicazione
  cancel-in-progress: false

# models: read = IA gratuita di GitHub (GitHub Models) di riserva quando Gemini è sovraccarico
permissions:
  contents: read
  models: read

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installo
        run: npm ci --no-audit --no-fund
      - name: Giro di pubblicazione
        run: npm run giro
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: qlueiocu
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SITE_URL: https://www.caliumiracing.com
          NEXT_PUBLIC_AMAZON_TAG: caliumiracing-21
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
