name: Esplora API MotoGP
on: workflow_dispatch
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - name: Campioni
        run: |
          B=https://api.motogp.pulselive.com/motogp/v1/results
          for Y in 1960 1995 2005 2024; do
            S=$(curl -s $B/seasons | jq -r ".[] | select(.year==$Y) | .id")
            C=$(curl -s "$B/categories?seasonUuid=$S" | jq -r '.[0].id')
            E=$(curl -s "$B/events?seasonUuid=$S&isFinished=true" | jq -r '[.[]|select(.test==false)][3].id')
            echo "ANNO $Y SESSIONI $(curl -s "$B/sessions?eventUuid=$E&categoryUuid=$C" | jq -c '[.[]|{type,number}]')"
            ID=$(curl -s "$B/sessions?eventUuid=$E&categoryUuid=$C" | jq -r '[.[]|select(.type=="RAC")]|last|.id')
            echo "RECORDS $(curl -s "$B/session/$ID/classification?test=false" | jq -c '.records')" | head -c 1500; echo
            echo "BESTLAP $(curl -s "$B/session/$ID/classification?test=false" | jq -c '[.classification[]|.best_lap]|.[0:3]')"
            echo "PUNTI $(curl -s "$B/session/$ID/classification?test=false" | jq -c '[.classification[]|.points]|.[0:12]')"
          done
