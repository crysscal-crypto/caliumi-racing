name: Prova feed RSS
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (compatible; CaliumiRacingBot/1.0; +https://caliumiracing.com)"
          for u in https://www.omnimoto.it/feed https://www.motorbox.com/rss/moto https://www.motorbox.com/rss https://www.formulapassion.it/feed https://www.automoto.it/rss/news.xml https://www.motoonline.it/feed https://www.motorionline.com/feed https://www.motori.it/feed https://www.insidemotori.it/feed https://www.motoblog.it/feed https://www.insella.it/feed https://www.motociclismo.it/feed/ https://www.motociclismo.it/rss.xml https://www.corsedimoto.com/feed/ https://www.corsedimoto.com/rss https://www.gpone.com/it/rss.xml https://it.motorsport.com/rss/motocross/news/ https://it.motorsport.com/rss/enduro/news/ https://it.motorsport.com/rss/rally/news/ https://www.moto.it/rss/news-prove-moto.xml https://www.moto.it/rss/news-mercato-moto.xml https://www.moto.it/rss/news-attualita-moto.xml https://www.automoto.it/rss/news-f1.xml https://www.motoblog.it/feed/ https://www.motorionline.com/moto/feed ; do
            r=$(curl -sL -m 15 -A "$UA" -w "\n%{http_code}" "$u"); code=$(echo "$r" | tail -1); n=$(echo "$r" | grep -o "<item\|<entry" | wc -l); t=$(echo "$r" | grep -o "<title>[^<]*" | sed -n 3p | cut -c8-80)
            echo "FEED $code $n $u | $t"
          done
