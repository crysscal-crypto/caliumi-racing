name: Prova URL
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for u in news-sitemap.xml feed.xml sitemap.xml robots.txt; do
            echo "URL $u $(curl -s -o /tmp/o -w '%{http_code} %{content_type}' https://www.caliumiracing.com/$u)"; head -c 700 /tmp/o; echo
          done
