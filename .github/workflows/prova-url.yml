name: Prova URL
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          U=$(curl -s https://www.caliumiracing.com/feed.xml | grep -o '<link>https://www.caliumiracing.com/notizie/[^<]*' | head -1 | cut -c7-)
          echo "URL $U"
          for ua in "Twitterbot/1.0" "facebookexternalhit/1.1" "Mozilla/5.0"; do
            echo "UA $ua $(curl -s -o /tmp/p -w '%{http_code}' -A "$ua" "$U")"
            grep -o '<meta[^>]*\(og:image\|twitter:[a-z]*\)[^>]*>' /tmp/p | head -5
          done
          IMG=$(grep -o 'property="og:image" content="[^"]*' /tmp/p | head -1 | sed 's/.*content="//; s/&amp;/\&/g')
          echo "IMG $IMG"; curl -s -o /dev/null -w 'img %{http_code} %{content_type} %{size_download}\n' -A "Twitterbot/1.0" "$IMG"
